# ─────────────────────────────────────────────────────────
# Daily Gentle Publish — scheduled future-dated post release
# ─────────────────────────────────────────────────────────
#
# ARCHITECTURE:
# Cloudflare Pages is connected to this repo via Git integration.
# When ANY commit is pushed to the production branch, Cloudflare
# automatically runs `npm run build` and deploys the `_site/` output.
#
# This workflow does NOT deploy anything itself. It does NOT need
# a Cloudflare API token. It has one job:
#
#   Once per day (Mon–Sat, skip Sundays), check if any blog post
#   Markdown file has a publishDate that has just become eligible
#   (i.e. the date has arrived). If so, it makes an empty commit
#   to trigger a Cloudflare rebuild — OR, if no posts are newly
#   eligible, it does nothing and exits silently.
#
# Why this works: the build script already filters posts by date.
# A post with a future publishDate is simply invisible until its
# date arrives. Once the date arrives, this workflow triggers a
# rebuild so the post appears on the live site.
#
# If you prefer to skip this entirely and just push a commit
# manually when a post goes live, you can disable this workflow
# and Cloudflare will still deploy on every push.
# ─────────────────────────────────────────────────────────

name: Daily Gentle Publish

permissions:
  contents: write

on:
  schedule:
    # 07:00 UTC every day, Monday through Saturday (skip Sunday)
    - cron: '0 7 * * 1-6'
  workflow_dispatch: # Allow manual trigger for testing

jobs:
  check-and-trigger:
    runs-on: ubuntu-latest
    # Only run on the production branch
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Check for newly eligible posts
        id: check
        run: |
          # Look for posts whose publishDate is today (within the last 24h)
          TODAY=$(date -u +%Y-%m-%d)
          echo "Checking for posts with publishDate on or before $TODAY that were not yet published..."
          
          # Count posts that have a publishDate of today
          # These are "newly eligible" — they just became publishable
          NEWLY_ELIGIBLE=0
          
          if [ -d posts ]; then
            for file in posts/*.md; do
              [ -e "$file" ] || continue
              # Extract publishDate from frontmatter
              PUB_DATE=$(grep -m1 '^publishDate:' "$file" | sed 's/.*: *//' | tr -d '"' | tr -d "'")
              if [ -n "$PUB_DATE" ]; then
                # Check if this date is today
                PUB_DATE_CLEAN=$(echo "$PUB_DATE" | cut -dT -f1)
                if [ "$PUB_DATE_CLEAN" = "$TODAY" ]; then
                  echo "  ✓ Newly eligible: $file (publishDate: $PUB_DATE)"
                  NEWLY_ELIGIBLE=$((NEWLY_ELIGIBLE + 1))
                fi
              fi
            done
          fi
          
          echo "newly_eligible=$NEWLY_ELIGIBLE" >> $GITHUB_OUTPUT
          
          if [ "$NEWLY_ELIGIBLE" -gt 0 ]; then
            echo "Found $NEWLY_ELIGIBLE newly eligible post(s). Will trigger rebuild."
          else
            echo "No newly eligible posts today. No action needed."
          fi

      - name: Trigger Cloudflare rebuild
        if: steps.check.outputs.newly_eligible != '0'
        run: |
          # Make an empty commit to trigger Cloudflare's Git integration
          # This causes Cloudflare to re-run `npm run build` and deploy
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Empty commit with descriptive message
          git commit --allow-empty -m "chore: trigger rebuild for newly published post(s)"
          git push
